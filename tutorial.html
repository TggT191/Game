<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="CSS/battle.css">
  <link rel="stylesheet" href="CSS/tutorial.css">
  <title>WildCard - Tutorial</title>
</head>
<body>

<!-- TUTORIAL BATTLE SCREEN -->
<div id="screenBattle" class="battle-screen">

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-left">
      <div class="hud-name-row">
        <span class="hud-name" id="opponentName">Training Dummy</span>
        <span class="element-badge" id="opponentElementBadge">🔥</span>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-bg"><div class="hp-bar-fill opponent-hp" id="opponentHPBar" style="width:100%;background:#9a4a4a"></div></div>
        <span class="hp-text" id="opponentHPText">100 / 100</span>
      </div>
      <div class="status-badges" id="opponentStatus"></div>
    </div>
    <div class="hud-center">
      <div class="round-timer" id="roundTimer">--:--</div>
      <div class="round-info">
        <span id="roundLabel">Tutorial</span>
      </div>
      <div class="turn-info your-turn" id="turnInfo">YOUR TURN</div>
    </div>
    <div class="hud-right">
      <div class="hud-name-row hud-name-row-right">
        <span class="element-badge" id="playerElementBadge">🌿</span>
        <span class="hud-name">You</span>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-bg"><div class="hp-bar-fill player-hp" id="playerHPBar" style="width:100%;background:#4a9a4a"></div></div>
        <span class="hp-text" id="playerHPText">150 / 150</span>
      </div>
      <div class="energy-bar-wrap">
        <div class="energy-bar-bg"><div class="energy-bar-fill" id="playerEnergyBar" style="width:100%"></div></div>
        <span class="energy-text" id="playerEnergyText">150 / 150</span>
      </div>
      <div class="status-badges" id="playerStatus"></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-felt">

    <!-- Opponent hand -->
    <div class="opp-fan-area">
      <div class="opp-fan" id="opponentHand"></div>
    </div>

    <!-- Center -->
    <div class="center-zone">
      <div class="deck-pile" id="deckPile">
        <div class="deck-pile-cards">
          <div class="deck-pile-card"></div>
          <div class="deck-pile-card"></div>
          <div class="deck-pile-card"></div>
        </div>
        <div class="deck-pile-count" id="deckPileCount">∞</div>
      </div>
      <div class="battle-log" id="battleLog"></div>
    </div>

    <!-- Player hand -->
    <div class="player-fan-area">
      <div class="player-fan" id="playerHand"></div>
    </div>

  </div>

  <!-- Bottom HUD -->
  <div class="hud-bottom">
    <div class="turn-timer-bar">
      <div class="turn-timer-fill" id="turnTimerFill" style="width:100%"></div>
    </div>
    <div class="action-row">
      <div class="action-buttons" id="actionButtons">
        <button class="action-btn" id="btnShuffle" onclick="tutShuffle()" disabled>🔀 Shuffle</button>
        <button class="action-btn" id="btnUseItem" onclick="tutOpenBag()" disabled>🎒 Items <span id="bagCount">(1)</span></button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="turn-timer-text" id="turnTimerText"></span>
        <button class="pause-btn" onclick="goMainMenu()">✕ Exit</button>
      </div>
    </div>
  </div>

</div>

<!-- Tutorial Tooltip -->
<div class="tut-tooltip" id="tutTooltip">
  <div class="tut-tooltip-text" id="tutTooltipText"></div>
  <button class="tut-continue-btn" id="tutContinueBtn" onclick="advance()">OK, got it →</button>
</div>

<!-- Item Bag Modal (tutorial version) -->
<div class="modal-overlay hidden" id="bagModal" onclick="closeBagOutside(event)">
  <div class="bag-modal">
    <h3 class="modal-title">🎒 Item Bag</h3>
    <div class="bag-grid" id="bagGrid"></div>
    <button class="btn-secondary-game" onclick="closeBag()">Close</button>
  </div>
</div>

<!-- Tutorial Complete Screen -->
<div class="tut-complete hidden" id="tutComplete">
  <div class="tut-complete-box">
    <div class="tut-complete-icon">🎉</div>
    <h2>Tutorial Complete!</h2>
    <p>You now know the basics of WildCard. Good luck in battle!</p>
    <button class="btn-primary-game" onclick="goMainMenu()">Back to Main Menu</button>
  </div>
</div>

<script>
// ===================== TUTORIAL DATA =====================
const ELEMENT_ICONS = {Fire:'🔥',Water:'💧',Grass:'��',Lightning:'⚡',Earth:'🪨',Wind:'🌪',Light:'✨',Dark:'🌑'};
const ELEMENT_COLORS = {
  Fire:{bg:'#3a1a0a',border:'#c0440a',badge:'#e05a1a'},
  Water:{bg:'#0a1a3a',border:'#0a60c0',badge:'#1a80e0'},
  Grass:{bg:'#0a2a0a',border:'#2a8a2a',badge:'#3aaa3a'},
  Lightning:{bg:'#2a2a0a',border:'#c0b000',badge:'#e0d000'},
  Earth:{bg:'#2a1a0a',border:'#8a5a2a',badge:'#aa7a3a'},
  Wind:{bg:'#0a2a2a',border:'#2aaaa0',badge:'#3acac0'},
  Light:{bg:'#2a2a1a',border:'#c0c060',badge:'#e0e080'},
  Dark:{bg:'#1a0a2a',border:'#6a2a9a',badge:'#8a3aba'}
};

// Scripted tutorial cards for player
const PLAYER_HAND = [
  {id:'vine_whip',    name:'Vine Whip',    element:'Grass',     energy:1, damage:12, damageType:'single', effect:''},
  {id:'flame_burst',  name:'Flame Burst',  element:'Fire',      energy:1, damage:15, damageType:'single', effect:'30% Burn'},
  {id:'aqua_shot',    name:'Aqua Shot',    element:'Water',     energy:1, damage:15, damageType:'single', effect:''},
  {id:'healing_rain', name:'Healing Rain', element:'Water',     energy:2, damage:0,  damageType:'heal',   effect:'heal25'},
  {id:'thunder_strike',name:'Thunder Strike',element:'Lightning',energy:2,damage:30, damageType:'single', effect:''},
];

// Tutorial item
const TUT_ITEM = {id:'small_potion', name:'Small Potion', icon:'🧪', rarity:'common', desc:'Heal 20 HP', type:'heal', value:20};

// Tutorial steps
const STEPS = [
  {
    msg: '👋 Welcome to the tutorial! This is your hand at the bottom. Each card costs Energy ⚡ to play.',
    highlight: 'playerHand',
    waitFor: null,
    position: 'above'
  },
  {
    msg: '🌿 Click the <strong>Vine Whip</strong> card to attack the opponent!',
    highlight: 'card-vine_whip',
    waitFor: 'play-vine_whip',
    position: 'above'
  },
  {
    msg: '💥 Nice hit! The opponent is 🔥 Fire type. Your 🌿 Grass card deals <strong>2x damage</strong> — that\'s a type advantage! Watch the HP bar.',
    highlight: 'opponentHPBar',
    waitFor: null,
    position: 'below'
  },
  {
    msg: '⚠️ Type matchups matter! <strong>Strong against = 2x damage</strong>, <strong>Weak against = 0.5x</strong>. Your active element badge (top right) shows your current type.',
    highlight: 'playerElementBadge',
    waitFor: null,
    position: 'below'
  },
  {
    msg: '🤖 Now the opponent takes their turn. Watch your HP bar...',
    highlight: 'playerHPBar',
    waitFor: 'opp-turn-done',
    position: 'below',
    autoAdvance: true
  },
  {
    msg: '🔀 Your hand is getting low. Click <strong>Shuffle</strong> to draw new cards from the deck!',
    highlight: 'btnShuffle',
    waitFor: 'shuffle-done',
    position: 'above',
    enableShuffle: true
  },
  {
    msg: '🎒 You have an item in your bag! Click <strong>Items</strong> to use it. Items don\'t end your turn!',
    highlight: 'btnUseItem',
    waitFor: 'item-used',
    position: 'above',
    enableItem: true
  },
  {
    msg: '⚡ Great! Now play the <strong>Thunder Strike</strong> card to deal big damage!',
    highlight: 'card-thunder_strike',
    waitFor: 'play-thunder_strike',
    position: 'above'
  },
  {
    msg: '🏆 You defeated the Training Dummy! You\'ve learned the basics. Good luck in real battles!',
    highlight: null,
    waitFor: 'complete',
    position: 'center',
    autoAdvance: true,
    complete: true
  }
];

// ===================== STATE =====================
let currentStep = 0;
let playerHP = 150, playerMaxHP = 150;
let opponentHP = 100, opponentMaxHP = 100;
let playerEnergy = 150;
let playerBag = [TUT_ITEM.id];
let waitingFor = null;

// ===================== INIT =====================
window.onload = function() {
  renderOpponentHand(5);
  renderPlayerHand();
  addLog('Tutorial started! Follow the instructions.');
  setTimeout(() => runStep(0), 500);
};

// ===================== STEPS =====================
function runStep(idx) {
  currentStep = idx;
  const step = STEPS[idx];
  waitingFor = step.waitFor;

  // Enable/disable buttons
  document.getElementById('btnShuffle').disabled = !step.enableShuffle;
  document.getElementById('btnUseItem').disabled = !step.enableItem;

  // Show/hide the continue button
  // Show it only on steps where the player just needs to read (no specific element to click)
  const continueBtn = document.getElementById('tutContinueBtn');
  continueBtn.style.display = (!step.waitFor || step.waitFor === null) ? 'block' : 'none';

  // Show tooltip
  showTooltip(step.msg, step.highlight, step.position);

  // Reset all card pointer events
  document.querySelectorAll('.hand-card').forEach(c => {
    c.classList.remove('tut-highlight');
    c.style.pointerEvents = 'none';
  });

  // Enable only the highlighted card
  if (step.highlight && step.highlight.startsWith('card-')) {
    const cardId = step.highlight.replace('card-', '');
    document.querySelectorAll('.hand-card').forEach(c => {
      if (c.dataset.cardId === cardId) {
        c.classList.add('tut-highlight');
        c.style.pointerEvents = 'auto';
      }
    });
  }

  if (step.autoAdvance && step.waitFor === 'opp-turn-done') {
    setTimeout(() => doOpponentTurn(), 1800);
  }

  if (step.complete) {
    setTimeout(() => {
      hideTooltip();
      document.getElementById('tutComplete').classList.remove('hidden');
    }, 2000);
  }
}

function advance() {
  if (currentStep < STEPS.length - 1) {
    runStep(currentStep + 1);
  }
}

// ===================== PLAYER ACTIONS =====================
function playCard(cardId) {
  if (waitingFor !== 'play-' + cardId) return;

  const cardDefs = {
    'vine_whip':     {damage:12, element:'Grass'},
    'thunder_strike':{damage:30, element:'Lightning'}
  };
  const def = cardDefs[cardId];
  if (!def) return;

  // Animate
  const cardEl = document.querySelector('[data-card-id="' + cardId + '"]');
  if (cardEl) cardEl.classList.add('playing');

  setTimeout(() => {
    // Vine Whip vs Fire = 2x (Grass strong against Fire)
    const actualDmg = cardId === 'vine_whip' ? def.damage * 2 : def.damage;
    opponentHP = Math.max(0, opponentHP - actualDmg);
    if (cardId === 'vine_whip') {
      addLog('You used Vine Whip for ' + actualDmg + ' damage! (Super effective! x2)');
    } else {
      addLog('You used ' + cardId.replace(/_/g,' ') + ' for ' + actualDmg + ' damage!');
    }
    updateHPBars();

    // Update element badge
    document.getElementById('playerElementBadge').textContent = ELEMENT_ICONS[def.element];
    document.getElementById('playerElementBadge').style.background = ELEMENT_COLORS[def.element].bg;
    document.getElementById('playerElementBadge').style.borderColor = ELEMENT_COLORS[def.element].border;

    // Remove card from hand display
    if (cardEl) cardEl.remove();

    hideTooltip();
    advance();
  }, 500);
}

function tutShuffle() {
  if (waitingFor !== 'shuffle-done') return;
  document.getElementById('btnShuffle').disabled = true;
  addLog('You drew new cards from the deck!');
  // Add 2 more cards to hand
  const newCards = [
    {id:'thunder_strike', name:'Thunder Strike', element:'Lightning', energy:2, damage:30, damageType:'single', effect:''},
    {id:'rock_smash',     name:'Rock Smash',     element:'Earth',     energy:2, damage:25, damageType:'single', effect:''},
  ];
  newCards.forEach(c => PLAYER_HAND.push(c));
  renderPlayerHand();
  hideTooltip();
  advance();
}

function tutOpenBag() {
  if (waitingFor !== 'item-used') return;
  renderBagGrid();
  document.getElementById('bagModal').classList.remove('hidden');
}

function closeBag() { document.getElementById('bagModal').classList.add('hidden'); }
function closeBagOutside(e) { if(e.target===document.getElementById('bagModal')) closeBag(); }

function renderBagGrid() {
  const grid = document.getElementById('bagGrid');
  grid.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'bag-item rarity-common';
  el.innerHTML = '<div class="item-icon">' + TUT_ITEM.icon + '</div><div class="item-name">' + TUT_ITEM.name + '</div><div class="item-desc">' + TUT_ITEM.desc + '</div>';
  el.onclick = () => useTutItem();
  grid.appendChild(el);
}

function useTutItem() {
  closeBag();
  playerHP = Math.min(playerMaxHP, playerHP + TUT_ITEM.value);
  playerBag = [];
  document.getElementById('bagCount').textContent = '(0)';
  addLog('Used Small Potion: healed 20 HP!');
  updateHPBars();
  hideTooltip();
  advance();
}

function doOpponentTurn() {
  document.getElementById('turnInfo').textContent = 'OPPONENT TURN';
  document.getElementById('turnInfo').className = 'turn-info opp-turn';
  addLog('Opponent used Flame Burst for 15 damage!');
  playerHP = Math.max(0, playerHP - 15);
  updateHPBars();

  // Flash
  setTimeout(() => {
    document.getElementById('turnInfo').textContent = 'YOUR TURN';
    document.getElementById('turnInfo').className = 'turn-info your-turn';
    advance();
  }, 1500);
}

// ===================== RENDER =====================
function renderPlayerHand() {
  const hand = document.getElementById('playerHand');
  hand.innerHTML = '';
  PLAYER_HAND.forEach(card => {
    const col = ELEMENT_COLORS[card.element] || {bg:'#2b2f3a',border:'#555',badge:'#aaa'};
    const el = document.createElement('div');
    el.className = 'hand-card';
    el.dataset.cardId = card.id;
    el.style.setProperty('--card-bg', col.bg);
    el.style.setProperty('--card-border', col.border);
    el.style.setProperty('--card-badge', col.badge);
    el.style.pointerEvents = 'none';
    el.innerHTML = `
      <div class="hc-element">${ELEMENT_ICONS[card.element]} ${card.element}</div>
      <div class="hc-name">${card.name}</div>
      <div class="hc-stats"><span class="hc-energy">⚡${card.energy}</span><span class="hc-dmg">${card.damage||card.damageType}</span></div>
      <div class="hc-effect">${card.effect||'—'}</div>`;
    el.onclick = () => playCard(card.id);
    hand.appendChild(el);
  });
}

function renderOpponentHand(count) {
  const hand = document.getElementById('opponentHand');
  hand.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'opp-card-back';
    el.textContent = '?';
    hand.appendChild(el);
  }
}

function updateHPBars() {
  const pp = (playerHP / playerMaxHP) * 100;
  const op = (opponentHP / opponentMaxHP) * 100;
  document.getElementById('playerHPBar').style.width = pp + '%';
  document.getElementById('playerHPBar').style.background = pp > 50 ? '#4a9a4a' : pp > 25 ? '#e0d000' : '#e05a1a';
  document.getElementById('playerHPText').textContent = playerHP + ' / ' + playerMaxHP;
  document.getElementById('opponentHPBar').style.width = op + '%';
  document.getElementById('opponentHPBar').style.background = op > 50 ? '#9a4a4a' : op > 25 ? '#e0d000' : '#e05a1a';
  document.getElementById('opponentHPText').textContent = opponentHP + ' / ' + opponentMaxHP;
}

function addLog(msg) {
  const log = document.getElementById('battleLog');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.textContent = msg;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 10) log.removeChild(log.firstChild);
}

// ===================== TOOLTIP =====================
function showTooltip(msg, highlightId, position) {
  const tooltip = document.getElementById('tutTooltip');
  document.getElementById('tutTooltipText').innerHTML = msg;

  if (!highlightId || highlightId === null) {
    tooltip.style.top = '50%';
    tooltip.style.left = '50%';
    tooltip.style.transform = 'translate(-50%, -50%)';
    tooltip.classList.add('visible');
    return;
  }

  let targetEl = null;
  if (highlightId.startsWith('card-')) {
    targetEl = document.querySelector('[data-card-id="' + highlightId.replace('card-','') + '"]');
  } else {
    targetEl = document.getElementById(highlightId);
  }

  tooltip.classList.add('visible');

  if (targetEl) {
    const rect = targetEl.getBoundingClientRect();
    if (position === 'above') {
      tooltip.style.left = Math.min(window.innerWidth - 320, Math.max(10, rect.left + rect.width/2 - 160)) + 'px';
      tooltip.style.top = (rect.top - 10) + 'px';
      tooltip.style.transform = 'translateY(-100%)';
    } else if (position === 'below') {
      tooltip.style.left = Math.min(window.innerWidth - 320, Math.max(10, rect.left + rect.width/2 - 160)) + 'px';
      tooltip.style.top = (rect.bottom + 10) + 'px';
      tooltip.style.transform = 'none';
    }
    // Highlight target
    targetEl.classList.add('tut-ring');
  }
}

function hideTooltip() {
  document.getElementById('tutTooltip').classList.remove('visible');
  document.querySelectorAll('.tut-ring').forEach(e => e.classList.remove('tut-ring'));
}

function goMainMenu() { window.location.href = 'main menu.html'; }
</script>
</body>
</html>
