<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="CSS/mm.css">
  <title>WildCard</title>
</head>
<body>

  <!-- ===== SCREEN: Main Menu ===== -->
  <div class="screen" id="screenMainMenu">
    <div class="main-wrapper">
      <h1 class="title">WildCard</h1>
      <div class="table-wrapper">
        <div class="table-surface">
          <div class="card-row">
            <div class="card-btn" onclick="window.location.href='battle.html?first=player&round=1'">Play</div>
            <div class="card-btn" onclick="window.location.href='tutorial.html'">Tutorial</div>
            <div class="card-btn" onclick="openSettings()">Settings</div>
            <div class="card-btn" onclick="openBuildDeck()">Build Deck</div>
            <div class="card-btn" onclick="quitGame()">Quit</div>
          </div>
        </div>
      </div>
    </div>


  </div>


  <!-- ===== Tutorial Modal ===== -->
  <div class="modal-overlay tut-overlay" id="tutorialOverlay" onclick="closeTutorialOutside(event)">
    <div class="tut-modal">
      <div class="tut-header">
        <span class="tut-page-label" id="tutPageLabel">1 / 7</span>
        <h2 class="tut-title" id="tutTitle">Welcome to WildCard</h2>
        <button class="close-btn tut-close" onclick="closeTutorial()">✕</button>
      </div>
      <div class="tut-body" id="tutBody"></div>
      <div class="tut-footer">
        <button class="tut-nav-btn" id="tutPrev" onclick="tutNav(-1)">← Prev</button>
        <div class="tut-dots" id="tutDots"></div>
        <button class="tut-nav-btn tut-next" id="tutNext" onclick="tutNav(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- ===== Settings Modal ===== -->
  <div class="modal-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
    <div class="settings-modal">
      <h2 class="settings-title">Settings</h2>
      <div class="setting-item">
        <label for="musicVolume">Music Volume</label>
        <div class="slider-row">
          <input type="range" id="musicVolume" min="0" max="100" value="70"
                 oninput="updateVolume('musicVolume', 'musicVal', this.value)">
          <span id="musicVal">70%</span>
        </div>
      </div>
      <div class="setting-item">
        <label for="sfxVolume">Sound Effects</label>
        <div class="slider-row">
          <input type="range" id="sfxVolume" min="0" max="100" value="70"
                 oninput="updateVolume('sfxVolume', 'sfxVal', this.value)">
          <span id="sfxVal">70%</span>
        </div>
      </div>
      <div class="setting-item">
        <label>Fullscreen</label>
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">Enter Fullscreen</button>
      </div>
      <button class="close-btn" onclick="closeSettings()">Close</button>
    </div>
  </div>

  <!-- ===== Build Deck Modal ===== -->
  <div class="modal-overlay bd-overlay" id="buildDeckOverlay" onclick="closeBuildDeckOutside(event)">
    <div class="bd-modal">

      <!-- Header -->
      <div class="bd-header">
        <h2 class="bd-title">Build Deck</h2>
        <div class="deck-counter">Deck: <span id="deckCount">0</span> / 10</div>
        <button class="close-btn bd-close-btn" onclick="closeBuildDeck()">✕</button>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
        <button class="filter-btn" onclick="filterCards('Fire', this)">🔥 Fire</button>
        <button class="filter-btn" onclick="filterCards('Water', this)">💧 Water</button>
        <button class="filter-btn" onclick="filterCards('Grass', this)">🌿 Grass</button>
        <button class="filter-btn" onclick="filterCards('Lightning', this)">⚡ Lightning</button>
        <button class="filter-btn" onclick="filterCards('Earth', this)">🪨 Earth</button>
        <button class="filter-btn" onclick="filterCards('Wind', this)">🌪 Wind</button>
        <button class="filter-btn" onclick="filterCards('Light', this)">✨ Light</button>
        <button class="filter-btn" onclick="filterCards('Dark', this)">🌑 Dark</button>
      </div>

      <!-- Body -->
      <div class="bd-body">
        <!-- Card Collection -->
        <div class="collection-panel">
          <div class="card-grid" id="cardGrid"></div>
        </div>

        <!-- Deck Panel -->
        <div class="deck-panel">
          <h3 class="deck-panel-title">Your Deck <span class="deck-count-badge" id="deckBadge">0/10</span></h3>
          <div class="deck-list" id="deckList">
            <p class="deck-empty-msg" id="deckEmptyMsg">Add cards from the collection.</p>
          </div>
          <div class="deck-actions">
            <button class="action-btn save-btn" onclick="saveDeck()">Save</button>
            <button class="action-btn clear-btn" onclick="clearDeck()">Clear</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast-msg" id="toastMsg"></div>
  <!-- Fullscreen restore prompt -->
  <div id="fsPrompt" class="fs-prompt hidden" onclick="restoreFullscreen()">🖥️ Click to restore fullscreen</div>

  
  <script>
    // =====================
    //  Tutorial
    // =====================
    const TUTORIAL_PAGES = [
      {
        title: '📖 Welcome to WildCard',
        content: `
          <p>WildCard is a turn-based card battle game where you fight opponents using elemental cards.</p>
          <p>Each round you have <strong>10 minutes</strong> to defeat your opponent before time runs out.</p>
          <p>Every 5 rounds is a <strong>Boss Battle</strong> — bosses have more HP and smarter AI.</p>
          <div class="tut-tip">💡 Win rounds to earn item rewards and progress further!</div>
        `
      },
      {
        title: '⚔ How Battle Works',
        content: `
          <p>Each turn you can do <strong>one</strong> of the following:</p>
          <ul class="tut-list">
            <li>🃏 <strong>Play a Card</strong> — click any card in your hand to use it</li>
            <li>🔀 <strong>Shuffle</strong> — draw new cards from the deck pile</li>
            <li>🎒 <strong>Use an Item</strong> — use an item from your bag (does NOT end your turn)</li>
          </ul>
          <p>You have <strong>1 minute</strong> per turn. If you don't act, your turn passes automatically.</p>
          <div class="tut-tip">💡 Items are free actions — use one then still play a card!</div>
        `
      },
      {
        title: '🃏 Cards & Energy',
        content: `
          <p>Each card costs <strong>Energy ⚡</strong> to play. You start each round with <strong>150 Energy</strong>.</p>
          <p>Cards have different types:</p>
          <ul class="tut-list">
            <li>⚔ <strong>Damage</strong> — deals HP damage to the opponent</li>
            <li>💚 <strong>Heal</strong> — restores your HP</li>
            <li>✨ <strong>Buff</strong> — boosts your stats for a few turns</li>
            <li>🌀 <strong>AoE / Multi-hit</strong> — hits multiple times or in an area</li>
          </ul>
          <p>Cards that are too expensive to play are <strong>greyed out</strong>.</p>
          <div class="tut-tip">💡 Use the Shuffle button to draw fresh cards from the deck when your hand is weak!</div>
        `
      },
      {
        title: '🔥 Elements & Type Matchups',
        content: `
          <p>Your <strong>active element</strong> is determined by the last card you played. The same applies to your opponent.</p>
          <p>Type matchups affect damage:</p>
          <div class="tut-matchup-grid">
            <div class="tut-matchup"><span>🔥 Fire</span><span class="strong">→ 🌿 🌪</span><span class="weak">← 💧 🪨</span></div>
            <div class="tut-matchup"><span>💧 Water</span><span class="strong">→ 🔥 🪨</span><span class="weak">← 🌿 ⚡</span></div>
            <div class="tut-matchup"><span>🌿 Grass</span><span class="strong">→ 💧 🪨</span><span class="weak">← 🔥 🌪</span></div>
            <div class="tut-matchup"><span>⚡ Lightning</span><span class="strong">→ 💧 🌪</span><span class="weak">← 🪨</span></div>
            <div class="tut-matchup"><span>🪨 Earth</span><span class="strong">→ 🔥 ⚡</span><span class="weak">← 💧 🌿</span></div>
            <div class="tut-matchup"><span>🌪 Wind</span><span class="strong">→ 🌿 ⚡</span><span class="weak">← 🔥 🪨</span></div>
            <div class="tut-matchup"><span>✨ Light</span><span class="strong">→ 🌑 (2x)</span><span class="weak">← 🌑 (2x)</span></div>
            <div class="tut-matchup"><span>🌑 Dark</span><span class="strong">→ ALL (2x)</span><span class="weak">← ALL (2x)</span></div>
          </div>
          <div class="tut-tip">💡 <span class="strong">2x damage</span> = Super Effective! &nbsp; <span class="weak">0.5x damage</span> = Not very effective</div>
        `
      },
      {
        title: '💊 Status Effects',
        content: `
          <div class="tut-status-grid">
            <div class="tut-status"><span>🔥 Burn</span><span>5 damage per turn (3 turns)</span></div>
            <div class="tut-status"><span>☠ Poison</span><span>4 → 6 → 8 scaling damage per turn</span></div>
            <div class="tut-status"><span>⚡ Stun</span><span>Skip your next turn</span></div>
            <div class="tut-status"><span>🛡 Shield</span><span>Reduce incoming damage by 50%</span></div>
            <div class="tut-status"><span>✨ Barrier</span><span>Completely negate the next attack</span></div>
            <div class="tut-status"><span>🌿 Regen</span><span>Heal 10 HP per turn</span></div>
            <div class="tut-status"><span>🪨 Defense</span><span>Reduce damage by 25% for 3 turns</span></div>
            <div class="tut-status"><span>🌀 Slow</span><span>Opponent gains less energy</span></div>
          </div>
          <div class="tut-tip">💡 Use Purify Potion to remove all debuffs instantly!</div>
        `
      },
      {
        title: '🎒 Items & Bag',
        content: `
          <p>You can hold up to <strong>5 items</strong> in your bag. Items are rewarded after each round win.</p>
          <p>Using an item <strong>does not end your turn</strong> — you can still play a card after!</p>
          <p>Item rarities:</p>
          <ul class="tut-list">
            <li><span style="color:#aaa">⬜ Common</span> — basic heals, shields, debuffs</li>
            <li><span style="color:#7c9e7a">🟩 Uncommon</span> — stronger effects, buffs</li>
            <li><span style="color:#e0d000">👑 Legendary</span> — rare, powerful effects (Phoenix Feather, Chaos Dice, Time Crystal)</li>
          </ul>
          <p>If your bag is full after a win, you'll be asked to <strong>discard</strong> an item to make room.</p>
          <div class="tut-tip">💡 Legendary items have a 10% chance to appear as rewards!</div>
        `
      },
      {
        title: '🃏 Build Deck',
        content: `
          <p>From the main menu, open <strong>Build Deck</strong> to create your custom starting hand.</p>
          <ul class="tut-list">
            <li>Browse all <strong>24 cards</strong> across 8 elements</li>
            <li>Add up to <strong>10 cards</strong> to your deck</li>
            <li>Max <strong>2 copies</strong> of the same card</li>
            <li>Mix any elements you want</li>
          </ul>
          <p>When you <strong>Save</strong> your deck, it will be used as your starting hand at the beginning of every round.</p>
          <p>If you have no saved deck, you'll start with <strong>7 random cards</strong>.</p>
          <p>The <strong>Shuffle</strong> button in battle always draws from all 24 cards randomly — not just your saved deck.</p>
          <div class="tut-tip">💡 Build a focused deck around one element for consistent type advantages!</div>
        `
      }
    ];

    let tutPage = 0;

    function openTutorial() {
      tutPage = 0;
      renderTutPage();
      document.getElementById('tutorialOverlay').classList.add('active');
    }

    function closeTutorial() {
      document.getElementById('tutorialOverlay').classList.remove('active');
    }

    function closeTutorialOutside(e) {
      if (e.target === document.getElementById('tutorialOverlay')) closeTutorial();
    }

    function tutNav(dir) {
      tutPage = Math.max(0, Math.min(TUTORIAL_PAGES.length - 1, tutPage + dir));
      renderTutPage();
    }

    function renderTutPage() {
      const page = TUTORIAL_PAGES[tutPage];
      document.getElementById('tutTitle').textContent = page.title;
      document.getElementById('tutBody').innerHTML = page.content;
      document.getElementById('tutPageLabel').textContent = (tutPage + 1) + ' / ' + TUTORIAL_PAGES.length;

      // Prev/Next buttons
      document.getElementById('tutPrev').disabled = tutPage === 0;
      const nextBtn = document.getElementById('tutNext');
      if (tutPage === TUTORIAL_PAGES.length - 1) {
        nextBtn.textContent = 'Done ✓';
        nextBtn.onclick = closeTutorial;
      } else {
        nextBtn.textContent = 'Next →';
        nextBtn.onclick = () => tutNav(1);
      }

      // Dots
      const dots = document.getElementById('tutDots');
      dots.innerHTML = '';
      TUTORIAL_PAGES.forEach((_, i) => {
        const d = document.createElement('span');
        d.className = 'tut-dot' + (i === tutPage ? ' active' : '');
        d.onclick = () => { tutPage = i; renderTutPage(); };
        dots.appendChild(d);
      });
    }
    function openSettings() { document.getElementById('settingsOverlay').classList.add('active'); }
    function closeSettings() { document.getElementById('settingsOverlay').classList.remove('active'); }
    function closeSettingsOutside(e) { if (e.target===document.getElementById('settingsOverlay')) closeSettings(); }

    function updateVolume(sliderId, labelId, value) {
      document.getElementById(labelId).textContent = value + '%';
      // Save to localStorage
      localStorage.setItem(sliderId, value);
      // Hook up audio here when ready: e.g. musicAudio.volume = value / 100;
    }

    // =====================
    //  Fullscreen
    // =====================
    function toggleFullscreen() {
      const btn = document.getElementById('fullscreenBtn');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          btn.textContent = 'Exit Fullscreen';
          localStorage.setItem('fullscreen', '1');
        }).catch(()=>{});
      } else {
        document.exitFullscreen().then(() => {
          btn.textContent = 'Enter Fullscreen';
          localStorage.setItem('fullscreen', '0');
        }).catch(()=>{});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fullscreenBtn');
      if (btn) btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';
      if (!document.fullscreenElement) localStorage.setItem('fullscreen', '0');
    });

    // =====================
    //  Apply saved settings on load
    // =====================
    (function applySavedSettings() {
      const music = localStorage.getItem('musicVolume') || '70';
      const sfx   = localStorage.getItem('sfxVolume')   || '70';
      document.getElementById('musicVolume').value = music;
      document.getElementById('sfxVolume').value   = sfx;
      document.getElementById('musicVal').textContent = music + '%';
      document.getElementById('sfxVal').textContent   = sfx   + '%';

      // Show restore prompt if fullscreen was active before navigation
      if (localStorage.getItem('fullscreen') === '1' && !document.fullscreenElement) {
        document.getElementById('fsPrompt').classList.remove('hidden');
      }
    })();

    // =====================
    //  Quit
    // =====================
    function quitGame() {      const confirmed = confirm('Are you sure you want to quit?');
      if (confirmed) {
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1e2a22;color:#aaa;font-size:1.2rem;">Goodbye!! it was nice playing with you!.</div>';
      }
    }

    // =====================
    //  Build Deck
    // =====================
    const ALL_CARDS = [
      { id:'flame_burst',    name:'Flame Burst',    element:'Fire',      energy:1, damage:'15',         effect:'30% Burn' },
      { id:'inferno_slash',  name:'Inferno Slash',  element:'Fire',      energy:3, damage:'40',         effect:'Self takes 10' },
      { id:'wildfire',       name:'Wildfire',       element:'Fire',      energy:4, damage:'25 AoE',     effect:'Burn chance' },
      { id:'aqua_shot',      name:'Aqua Shot',      element:'Water',     energy:1, damage:'15',         effect:'—' },
      { id:'tidal_wave',     name:'Tidal Wave',     element:'Water',     energy:3, damage:'30',         effect:'Slow enemy' },
      { id:'healing_rain',   name:'Healing Rain',   element:'Water',     energy:2, damage:'Heal 25',    effect:'—' },
      { id:'vine_whip',      name:'Vine Whip',      element:'Grass',     energy:1, damage:'12',         effect:'—' },
      { id:'poison_spores',  name:'Poison Spores',  element:'Grass',     energy:2, damage:'10',         effect:'Poison' },
      { id:'root_trap',      name:'Root Trap',      element:'Grass',     energy:3, damage:'15',         effect:'50% Stun' },
      { id:'thunder_strike', name:'Thunder Strike', element:'Lightning', energy:2, damage:'30',         effect:'—' },
      { id:'static_field',   name:'Static Field',   element:'Lightning', energy:3, damage:'20',         effect:'Stun chance' },
      { id:'overcharge',     name:'Overcharge',     element:'Lightning', energy:2, damage:'Buff',       effect:'Buff Crit' },
      { id:'rock_smash',     name:'Rock Smash',     element:'Earth',     energy:2, damage:'25',         effect:'—' },
      { id:'stone_wall',     name:'Stone Wall',     element:'Earth',     energy:2, damage:'—',          effect:'+Defense' },
      { id:'earthquake',     name:'Earthquake',     element:'Earth',     energy:4, damage:'35 AoE',     effect:'—' },
      { id:'air_slash',      name:'Air Slash',      element:'Wind',      energy:1, damage:'15',         effect:'Fast' },
      { id:'tornado',        name:'Tornado',        element:'Wind',      energy:3, damage:'10x3',       effect:'RNG' },
      { id:'tailwind',       name:'Tailwind',       element:'Wind',      energy:2, damage:'Buff',       effect:'Buff Speed' },
      { id:'holy_beam',      name:'Holy Beam',      element:'Light',     energy:3, damage:'35',         effect:'2x vs Dark' },
      { id:'divine_shield',  name:'Divine Shield',  element:'Light',     energy:2, damage:'—',          effect:'50% reduction' },
      { id:'sanctuary',      name:'Sanctuary',      element:'Light',     energy:4, damage:'Heal+Shield',effect:'Heal + Shield' },
      { id:'shadow_strike',  name:'Shadow Strike',  element:'Dark',      energy:2, damage:'40',         effect:'—' },
      { id:'blood_pact',     name:'Blood Pact',     element:'Dark',      energy:3, damage:'55',         effect:'Lose 15 HP' },
      { id:'void_explosion', name:'Void Explosion', element:'Dark',      energy:5, damage:'80',         effect:'Both take dmg' },
    ];

    const ELEMENT_COLORS = {
      Fire:      { bg:'#3a1a0a', border:'#c0440a', badge:'#e05a1a' },
      Water:     { bg:'#0a1a3a', border:'#0a60c0', badge:'#1a80e0' },
      Grass:     { bg:'#0a2a0a', border:'#2a8a2a', badge:'#3aaa3a' },
      Lightning: { bg:'#2a2a0a', border:'#c0b000', badge:'#e0d000' },
      Earth:     { bg:'#2a1a0a', border:'#8a5a2a', badge:'#aa7a3a' },
      Wind:      { bg:'#0a2a2a', border:'#2aaaa0', badge:'#3acac0' },
      Light:     { bg:'#2a2a1a', border:'#c0c060', badge:'#e0e080' },
      Dark:      { bg:'#1a0a2a', border:'#6a2a9a', badge:'#8a3aba' },
    };

    const ELEMENT_ICONS = {
      Fire:'🔥', Water:'💧', Grass:'🌿', Lightning:'⚡',
      Earth:'🪨', Wind:'🌪', Light:'✨', Dark:'🌑'
    };

    let deck = [];
    let currentFilter = 'all';

    function openBuildDeck() {
      renderCollection();
      renderDeck();
      document.getElementById('buildDeckOverlay').classList.add('active');
    }

    function closeBuildDeck() {
      document.getElementById('buildDeckOverlay').classList.remove('active');
    }

    function closeBuildDeckOutside(e) {
      if (e.target === document.getElementById('buildDeckOverlay')) closeBuildDeck();
    }

    function filterCards(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCollection();
    }

    function renderCollection() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      const filtered = currentFilter === 'all' ? ALL_CARDS : ALL_CARDS.filter(c => c.element === currentFilter);
      const total = deck.reduce((s, d) => s + d.count, 0);

      filtered.forEach(card => {
        const col = ELEMENT_COLORS[card.element];
        const inDeck = deck.find(d => d.card.id === card.id);
        const count = inDeck ? inDeck.count : 0;
        const maxed = count >= 2;
        const deckFull = total >= 10;

        const el = document.createElement('div');
        el.className = 'coll-card' + (maxed ? ' maxed' : '');
        el.style.setProperty('--card-bg', col.bg);
        el.style.setProperty('--card-border', col.border);
        el.style.setProperty('--card-badge', col.badge);
        el.innerHTML = `
          <div class="coll-card-element">${ELEMENT_ICONS[card.element]} ${card.element}</div>
          <div class="coll-card-name">${card.name}</div>
          <div class="coll-card-stats">
            <span class="stat-energy">⚡${card.energy}</span>
            <span class="stat-dmg">${card.damage}</span>
          </div>
          <div class="coll-card-effect">${card.effect}</div>
          <div class="coll-card-footer">
            <span class="copy-count">${count}/2</span>
            <button class="add-btn" onclick="addCard('${card.id}')" ${maxed || deckFull ? 'disabled' : ''}>
              ${maxed ? 'Max' : deckFull ? 'Full' : '+ Add'}
            </button>
          </div>`;
        grid.appendChild(el);
      });
    }

    function renderDeck() {
      const list = document.getElementById('deckList');
      const emptyMsg = document.getElementById('deckEmptyMsg');
      const total = deck.reduce((s, d) => s + d.count, 0);
      document.getElementById('deckCount').textContent = total;
      document.getElementById('deckBadge').textContent = total + '/10';

      // Clear only the card rows, not the empty message element
      Array.from(list.children).forEach(child => {
        if (child !== emptyMsg) child.remove();
      });

      if (deck.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      deck.forEach(entry => {
        const col = ELEMENT_COLORS[entry.card.element];
        const row = document.createElement('div');
        row.className = 'deck-row';
        row.style.setProperty('--card-border', col.border);
        row.innerHTML = `
          <span class="deck-row-icon">${ELEMENT_ICONS[entry.card.element]}</span>
          <span class="deck-row-name">${entry.card.name}</span>
          <span class="deck-row-count">x${entry.count}</span>
          <button class="remove-btn" onclick="removeCard('${entry.card.id}')">✕</button>`;
        list.appendChild(row);
      });
    }

    function addCard(cardId) {
      const total = deck.reduce((s, d) => s + d.count, 0);
      if (total >= 10) { showToast('Deck is full! (10/10)'); return; }
      const card = ALL_CARDS.find(c => c.id === cardId);
      const existing = deck.find(d => d.card.id === cardId);
      if (existing) {
        if (existing.count >= 2) { showToast('Max 2 copies per card!'); return; }
        existing.count++;
      } else {
        deck.push({ card, count: 1 });
      }
      renderDeck();
      renderCollection();
    }

    function removeCard(cardId) {
      const idx = deck.findIndex(d => d.card.id === cardId);
      if (idx === -1) return;
      deck[idx].count--;
      if (deck[idx].count <= 0) deck.splice(idx, 1);
      renderDeck();
      renderCollection();
    }

    function saveDeck() {
      const total = deck.reduce((s, d) => s + d.count, 0);
      if (total === 0) { showToast('Add some cards first!'); return; }
      localStorage.setItem('wildcardDeck', JSON.stringify(deck));
      showToast('Deck saved! (' + total + ' cards)');
    }

    function clearDeck() {
      if (deck.length === 0) { showToast('Deck is already empty.'); return; }
      deck = [];
      localStorage.removeItem('wildcardDeck');
      renderDeck();
      renderCollection();
      showToast('Deck cleared. Random cards will be used in battle.');
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Load saved deck on startup
    const saved = localStorage.getItem('wildcardDeck');
    if (saved) {
      try {
        deck = JSON.parse(saved).map(e => ({
          card: ALL_CARDS.find(c => c.id === e.card.id),
          count: e.count
        })).filter(e => e.card);
      } catch(e) { deck = []; }
    }
  </script>
</body>
</html>
